# Coverage-guided fuzzing of the IR verifier (tests/fuzz/fuzz_ir_verify.c)
# and the event scheduler (tests/fuzz/fuzz_scheduler.c), built from
# src/core/ without R. Each harness's oracle is more than "no crash" (see
# its header). 30 seconds on a pull request, 30 minutes weekly.
on:
  # `labeled`/`unlabeled` so that adding or removing a CI label reruns it.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: "37 17 * * 0"
  workflow_dispatch:

name: fuzz

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    # Decided without a runner (ci.md, Labels); the gate inside repeats it.
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:fuzz'))
    uses: pedrobtz/r-actions/.github/workflows/fuzz.yml@v1
    with:
      harness: tests/fuzz/fuzz_ir_verify.c
      sources: src/core/ir.c
      cflags: -Isrc/core
      seed-corpus: tests/fuzz/corpus
      profile: auto
      max-total-time: 1800
      # The corpus reached 92.1% of ir.c's lines in Stage 2's 30-second run;
      # a little under, so a harness change that stops reaching code fails.
      reach-floor: 88

  fuzz-scheduler:
    # Decided without a runner (ci.md, Labels); the gate inside repeats it.
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:fuzz'))
    uses: pedrobtz/r-actions/.github/workflows/fuzz.yml@v1
    with:
      harness: tests/fuzz/fuzz_scheduler.c
      sources: src/core/sched.c
      cflags: -Isrc/core
      seed-corpus: tests/fuzz/corpus-scheduler
      profile: auto
      max-total-time: 1800
      # The seeds alone reach 83.8% of sched.c's lines (Stage 4, gcov);
      # fuzzing only adds to that.
      reach-floor: 75

  report:
    needs: fuzz
    if: ${{ always() && github.event_name == 'schedule' && needs.fuzz.result != 'skipped' }}
    permissions:
      issues: write
    uses: pedrobtz/r-actions/.github/workflows/report.yml@v1
    with:
      name: fuzz
      result: ${{ needs.fuzz.result }}
      finding: ${{ needs.fuzz.outputs.finding }}
      key: ${{ needs.fuzz.outputs.finding-key }}
      details: ${{ needs.fuzz.outputs.report }}
